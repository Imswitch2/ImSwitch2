name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so rapid pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (critical errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            setup.cfg
            pyproject.toml
      - run: pip install ruff
      - name: Check for critical errors only
        run: ruff check imswitch/

  test:
    # Path-scoped lanes running concurrently, so a failure localizes to its area
    # and the slow lane doesn't gate feedback from the fast one. The lanes are a
    # clean partition of the old single-job path list (parity proven by
    # --collect-only: unit 1297 + improcess 473 == combined 1770); the union
    # collects exactly the same tests, just split across two runners.
    # Still excluded from every lane (run in the manual `imswitch-test` workflow,
    # which has a real display via xvfb): imswitch/imcontrol/_test/ui (napari GUI
    # tests) — a dedicated `ui` lane with a proven offscreen/xvfb strategy is the
    # next step (Tier B3).
    name: No-Hardware Tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: unit
            paths: >-
              imswitch/test_no_hardware_profile.py
              imswitch/imcommon/_test
              imswitch/imcontrol/_test/unit
              imswitch/imcontrol/controller/_test
            extra: ""
          - lane: improcess
            paths: imswitch/improcess/_test
            # TODO: drop this ignore once the SNOUTY CPU deskew all-zero-output
            # failure is fixed (pre-existing failure on main).
            extra: "--ignore=imswitch/improcess/_test/test_snouty.py"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            setup.cfg
            pyproject.toml
      - name: Install dependencies
        # Single source of truth: the `test` extra pulls install_requires +
        # pytest / pytest-qt / pytest-cov / pytest-timeout / pytest-xdist. No
        # hand-maintained dependency list to drift out of sync.
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run no-hardware test lane
        env:
          QT_QPA_PLATFORM: offscreen
          # Force the non-interactive matplotlib backend so nothing tries to
          # load an interactive Qt backend on the headless runner.
          MPLBACKEND: Agg
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        # --timeout aborts any hung test instead of stalling the runner.
        # -n auto shards the lane across all runner cores; because plugin
        # autoload is disabled above, xdist must be loaded explicitly via
        # -p xdist.plugin (same as pytestqt / pytest_timeout). The -p flags
        # propagate to the xdist workers.
        run: |
          pytest -p xdist.plugin -p pytestqt.plugin -p pytest_timeout \
            ${{ matrix.paths }} ${{ matrix.extra }} \
            -n auto \
            --timeout=180 \
            -v

  build:
    name: Package Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            setup.cfg
            pyproject.toml
      - run: pip install build
      - name: Build package
        run: python -m build --no-isolation 2>/dev/null || python -m build
