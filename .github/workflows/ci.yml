name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (critical errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - name: Check for critical errors only
        run: ruff check imswitch/

  test:
    name: No-Hardware Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        # Single source of truth: the `test` extra pulls install_requires +
        # pytest / pytest-qt / pytest-cov / pytest-timeout. No hand-maintained
        # dependency list to drift out of sync.
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run no-hardware test suite
        env:
          QT_QPA_PLATFORM: offscreen
          # Force the non-interactive matplotlib backend so nothing tries to
          # load an interactive Qt backend on the headless runner.
          MPLBACKEND: Agg
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        # Covers the full non-GUI suite: no-hardware profile, imcontrol unit +
        # controller tests, and the improcess processing/analysis tests.
        # --timeout aborts any hung test instead of stalling the runner.
        # Excluded here (run in the manual `imswitch-test` workflow, which has a
        # real display via xvfb): imswitch/imcontrol/_test/ui (napari GUI tests).
        # TODO: re-include improcess/_test/test_snouty.py once the SNOUTY CPU
        # deskew all-zero-output failure is fixed (pre-existing failure on main).
        run: |
          pytest -p pytestqt.plugin -p pytest_timeout \
            imswitch/test_no_hardware_profile.py \
            imswitch/imcontrol/_test/unit \
            imswitch/imcontrol/controller/_test \
            imswitch/improcess/_test \
            --ignore=imswitch/improcess/_test/test_snouty.py \
            --timeout=180 \
            -v

  build:
    name: Package Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install build
      - name: Build package
        run: python -m build --no-isolation 2>/dev/null || python -m build
