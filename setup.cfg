[metadata]
name = ImSwitch
version = attr: imswitch.__version__
author = Xavier Casas Moreno
author_email = xaviercm@kth.se
description = Microscopy control
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/kasasxav/ImSwitch
project_urls =
    Bug Tracker = https://github.com/kasasxav/ImSwitch/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)
    Operating System :: OS Independent

[options]
packages = find:
include_package_data = True
python_requires = >=3.10
install_requires =
    coloredlogs>=15
    colour-science>=0.3
    dataclasses-json>=0.5
    fastapi>=0.86
    h5py>=3.0
    luddite>=1.0
    matplotlib>=3.6
    # napari>=0.7 required: older napari (0.4.x) pins numpy<2 / pydantic<2, which
    # lets the resolver pair an old napari with a modern numpy/pydantic and break
    # imports (e.g. pydantic.main.ModelMetaclass) at test-collection time.
    # Capped: the ROI overlay relies on Shapes.features/text/editable, and an
    # unbounded floor claims support for majors that have not been tested.
    # See test_napari_shapes_contract.py, which runs on every PR.
    napari>=0.7.0,<0.8
    numpy>=1.21
    ome-zarr>=0.6
    Pillow>=9.0
    psutil>=5.8
    Pyro5>=5.14
    PyQt5>=5.15
    pyqtgraph>=0.12
    QScintilla>=2.12
    pyserial>=3.4
    QDarkStyle>=3.0
    qtawesome>=1.4
    qtpy>=2.0
    requests>=2.25
    scikit-image>=0.19
    scipy>=1.7
    Send2Trash>=1.8
    pint>=0.20
    setuptools>=42,<80
    tifffile>=2022
    uvicorn[standard]>=0.19
    vispy>=0.11
    zarr>=2.10

[options.extras_require]
hardware =
    nidaqmx>=0.9
    pylablib>=1.4
    pyvisa>=1.12
    pyvisa-py>=0.6
    microscope
    # NOTE: thorlabs_tsi_sdk is NOT on PyPI. Install it manually from the
    # Thorlabs ThorCam download (Scientific_Camera_Interfaces.zip > SDK >
    # Python Toolkit). See docs/installation.rst > "Vendor SDKs" for the
    # full procedure, including the native DLLs that ImSwitch needs at
    # runtime via the detector's `dllLocation` property.
imagej =
    # ImageJ/Fiji .roi and RoiSet.zip interop for the ROI manager. Optional
    # and lazily imported: without it the import/export buttons are disabled
    # with a tooltip, and nothing else notices.
    roifile>=2023.2.12
full =
    opencv-python>=4.5
    roifile>=2023.2.12
storm =
    # GPU point-cloud viewer for ImProcess localization results. Optional and
    # lazily imported: without it the napariStormViewer flag does nothing and
    # localization results keep their built-in histogram preview.
    #
    # 2.1.0 is the PyPI release the viewer boundary was verified against
    # (improcess/_test/test_napari_storm_contract.py). Do NOT take its
    # [pyqt6] extra — that pulls napari[pyqt6] and would put a second Qt
    # binding beside our PyQt5. Its base package pins no binding, so ours
    # satisfies it.
    #
    # napari-storm pins zarr<3 for its MINFLUX Zarr reader, so resolving this
    # extra moves an environment onto zarr 2.x. ImSwitch runs on either major
    # (imcommon/model/zarr_compat.py); to keep zarr 3, install the package
    # itself with `pip install --no-deps napari-storm` instead of the extra.
    napari-storm>=2.1
test =
    pytest>=7
    pytest-qt>=4
    pytest-cov>=4
    pytest-timeout>=2
    pytest-xdist>=3

[options.entry_points]
console_scripts =
    imswitch = imswitch.__main__:main
