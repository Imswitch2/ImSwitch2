name: imswitch-bundle

# DISABLED tag trigger.  The job uses `actions/upload-artifact@v2`,
# which GitHub hard-deprecated on 2024-11-30; runs fail at validation
# in ~3 seconds before any real work.  `actions/checkout@v2` and
# `actions/setup-python@v2` below are also deprecated.
#
# To reactivate:
#   - Bump to actions/checkout@v4, actions/setup-python@v5,
#     actions/upload-artifact@v4.
#   - Verify the imswitch.spec PyInstaller build still works under
#     newer Python (Python 3.9 in the matrix is end-of-life; consider
#     3.11+).
#   - Restore the `push:` block below.
#
# workflow_dispatch stays available for manual testing during the fix.
on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - '*'

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
    - uses: actions/checkout@v2
      with:
        ref: ${{ github.ref }}
    - name: Set up Python 3.9
      uses: actions/setup-python@v2
      with:
        python-version: 3.9
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install .
        python3 -m pip install pyinstaller
      shell: bash
    - name: Build bundle
      run: |
        pyinstaller imswitch.spec
    - name: Upload artifact
      uses: actions/upload-artifact@v2
      with:
        name: imswitch-${{ matrix.os }}
        path: dist
