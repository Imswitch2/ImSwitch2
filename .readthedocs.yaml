# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # PyQt5 is imported (never shown) while autodoc reads the manager and
  # setup-info classes; these are the shared libraries its Qt build links to.
  apt_packages:
    - libgl1
    - libegl1
    - libxkbcommon0
    - libdbus-1-3
    - libfontconfig1
    - libglib2.0-0

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# The docs import the package from the source tree (conf.py puts the repo
# root on sys.path); only the module-level imports of the documented modules
# are installed. See docs/requirements-readthedocs.txt.
python:
  install:
    - requirements: docs/requirements-readthedocs.txt
