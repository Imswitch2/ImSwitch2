name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (critical errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - name: Check for critical errors only
        run: ruff check imswitch/

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install PyQt5 qtpy pyqtgraph QDarkStyle \
                      numpy h5py zarr tifffile ome-zarr \
                      dataclasses-json colour-science \
                      pyserial requests Pyro5 luddite \
                      coloredlogs fastapi uvicorn \
                      scikit-image Send2Trash matplotlib \
                      nidaqmx Pillow scipy \
                      pytest pytest-qt
          pip install -e . --no-deps
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest imswitch/imcontrol/_test/unit/test_stores.py -v

  test-no-hardware:
    name: No-Hardware Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install no-hardware dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run no-hardware tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest -p pytestqt.plugin \
            imswitch/test_no_hardware_profile.py \
            imswitch/imcontrol/_test/unit \
            -v

  build:
    name: Package Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install build
      - name: Build package
        run: python -m build --no-isolation 2>/dev/null || python -m build
