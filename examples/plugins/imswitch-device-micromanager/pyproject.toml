[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "imswitch-device-micromanager"
version = "0.1.0"
description = "Micro-Manager device bridge for ImSwitch2, built on pymmcore-plus"
readme = "README.md"
# pymmcore (a pymmcore-plus dependency) requires Python >= 3.11; ImSwitch2 itself still supports 3.10.
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
keywords = ["imswitch", "imswitch-plugin", "micro-manager", "mmcore", "pymmcore-plus", "camera", "stage", "flip-mirror"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "imswitch2>=0.1",
    "pymmcore-plus>=0.18,<0.19",
    "numpy",
]

[project.optional-dependencies]
# mm-test-adapters ships the real MMCore DemoCamera adapters (and MMConfig_demo.cfg)
# for Linux, macOS (arm64 and x64) and Windows, so the tests run without hardware.
test = ["mm-test-adapters", "pytest", "jsonschema"]

[project.entry-points."imswitch.manifest"]
imswitch-device-micromanager = "imswitch_device_micromanager:imswitch.json"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imswitch_device_micromanager = [
    "imswitch.json",
    "schemas/*.schema.json",
    "setup_templates/*.json",
]
