# Remove bleed-through between channels with a measured mixing matrix.
# mixing[i][j] is how much of true channel j shows up in measured channel i; here
# 15 % of channel 0 leaks into channel 1. The true channels come from inverting it.
# Why a script: no processor mixes channels; Image calculator combines two results
# with one operation, not a matrix across all the channels at once.
#
# Run it on a synthetic recording (2 frames):
#   python -c "import sys; sys.path.insert(0, 'examples/improcess_workflows'); \
#     from _synthetic import write_synthetic_recording as w; w('cells.h5', frames=2)"
#   python -m imswitch.improcess.workflows run python_step_crosstalk.yaml \
#       --input cells.h5 --out results/
# or paste the code of the step into Tools -> Python step (it is also in
# Load snippet... as 'crosstalk').
#
# Derived from imswitch/_data/user_defaults/improcess_snippets/crosstalk.py by
# tools/make_python_recipe_workflows.py: edit the snippet, then run the tool.
name: python-crosstalk
schema: 1
description: Remove bleed-through between channels with a measured mixing matrix.
steps:
- step: source
  id: raw
- step: reconstruct
  id: rec
  reconstructor: view-only
  params: {}
  inputs:
  - raw
- step: process
  id: script
  processor: python
  params:
    ports: out
    code: |
      # Remove bleed-through between channels with a measured mixing matrix.
      # mixing[i][j] is how much of true channel j shows up in measured channel i; here
      # 15 % of channel 0 leaks into channel 1. The true channels come from inverting it.
      # Why a script: no processor mixes channels; Image calculator combines two results
      # with one operation, not a matrix across all the channels at once.
      ax = 0                                         # the channel axis; print(axes) lists the names
      mixing = np.array([[1.00, 0.00],
                         [0.15, 1.00]])

      if data.shape[ax] != len(mixing):
          raise ValueError(f"the matrix is for {len(mixing)} channels, the data has {data.shape[ax]} along axis {ax}")
      measured = np.moveaxis(data.astype(np.float32), ax, 0)
      true = np.tensordot(np.linalg.inv(mixing), measured, axes=(1, 0)).astype(np.float32)
      out = np.clip(np.moveaxis(true, 0, ax), 0, None)       # a negative count is noise, not signal
  inputs:
  - rec
- step: save
  id: save_out
  input: script.out
  fmt: tiff
  path_template: '{out_dir}/{source_stem}_crosstalk{ext}'
