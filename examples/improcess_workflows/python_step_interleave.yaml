# A Python step: three slices at a time, alternating between two outputs.
# The code is an ordinary parameter of the step, so it is recorded in every
# result's provenance, replays, and runs in batches like any other step.
#   python -m imswitch.improcess.workflows run python_step_interleave.yaml \
#       --input cells.h5 --out results/
# _synthetic.py in this folder writes a recording to try it on:
# write_synthetic_recording("cells.h5", frames=12).
# `ax = 0` is the stack axis of a recording; use axis("Z") when the file names
# its axes. `ports` are the outputs the code must set: here split.a and split.b.
name: python-step-interleave
schema: 1
steps:
  - {step: source, id: raw}
  - {step: reconstruct, id: rec, reconstructor: view-only, inputs: [raw]}
  - step: process
    id: split
    processor: python
    params:
      ports: a, b
      code: |
        ax = 0
        group = (np.arange(data.shape[ax]) // 3) % 2
        outputs = {
            "a": np.take(data, np.flatnonzero(group == 0), axis=ax),
            "b": np.take(data, np.flatnonzero(group == 1), axis=ax),
        }
    inputs: [rec]
  - {step: process, id: blur, processor: filter, params: {method: gaussian, radius: 1.0}, inputs: [split.a]}
  - {step: save, id: save_a, input: blur, fmt: tiff, path_template: "{out_dir}/{source_stem}_interleave_a{ext}"}
  - {step: save, id: save_b, input: split.b, fmt: tiff, path_template: "{out_dir}/{source_stem}_interleave_b{ext}"}
