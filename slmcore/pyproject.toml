[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "slmcore"
version = "0.1.0.dev0"
description = "Reusable SLM control, pattern generation and CGH framework"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "h5py>=3.0",
    "Pillow>=9.0",
    "qtpy>=2.0",
    "PyQt5>=5.15",
    "pyqtgraph>=0.12",
    "matplotlib>=3.6",
    "QDarkStyle>=3.0",
]


[project.optional-dependencies]
test = [
    "pytest>=7",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["slmcore*"]


[tool.pytest.ini_options]
testpaths = ["tests"]