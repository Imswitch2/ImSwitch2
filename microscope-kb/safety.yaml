# Safety Rules and Interlocks
#
# CRITICAL: This file defines safety constraints that MUST be respected
# by all code changes. AI agents must read this before modifying any
# hardware-related code.

safety:
  general_rules:
    - "Never enable a laser without verifying the safety interlock state"
    - "Never move a stage beyond its physical limits"
    - "Never start DAQ acquisition without confirming all channels are configured"
    - "Always implement timeout mechanisms for hardware operations"
    - "Always provide graceful shutdown on errors"

  laser_safety:
    max_power_mw: null  # TODO: Fill in per-laser limits
    interlock_required: true
    warmup_time_s: null  # TODO: Fill in
    rules:
      - "Laser power must never exceed the configured maximum"
      - "Laser must be disabled before changing modulation parameters"
      - "All laser changes must be logged"

  stage_safety:
    soft_limits:
      x_min_um: null  # TODO: Fill in
      x_max_um: null
      y_min_um: null
      y_max_um: null
      z_min_um: null
      z_max_um: null
    max_velocity_um_s: null  # TODO: Fill in
    rules:
      - "Never command a position outside soft limits"
      - "Verify home position before long-range moves"
      - "Reduce velocity for Z-axis moves near sample"

  daq_safety:
    max_voltage_v: null  # TODO: Fill in
    max_sample_rate_hz: null  # TODO: Fill in
    rules:
      - "Never exceed maximum voltage output"
      - "Verify channel configuration before starting acquisition"
      - "Always close DAQ tasks on exit or error"

  emergency_procedures:
    - step: "Immediate hardware shutdown"
      action: "Call the emergency stop function to disable all outputs"
    - step: "Laser emergency"
      action: "Disable all laser outputs, verify interlock engaged"
    - step: "Stage collision"
      action: "Stop all stage movement, do not re-home without inspection"
