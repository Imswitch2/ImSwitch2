name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so rapid pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (critical errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            setup.cfg
            pyproject.toml
      - run: pip install ruff
      - name: Check for critical errors only
        run: ruff check imswitch/

  test:
    # Path-scoped lanes running concurrently, so a failure localizes to its area
    # and the slow lane doesn't gate feedback from the fast one. The unit and
    # improcess lanes are a clean partition of the old single-job path list
    # (parity proven by --collect-only: unit 1297 + improcess 473 == combined
    # 1770); the `core` lane was added afterwards because imcommon/imscripting
    # were in neither the old list nor the split, so their tests -- the API
    # layer, the framework wrappers and the whole scripting module -- had never
    # run in CI at all.
    # Still excluded from every lane (run in the manual `imswitch-test` workflow,
    # which has a real display via xvfb): imswitch/imcontrol/_test/ui (napari GUI
    # tests) — a dedicated `ui` lane with a proven offscreen/xvfb strategy is the
    # next step (Tier B3).
    name: No-Hardware Tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: unit
            paths: >-
              imswitch/test_no_hardware_profile.py
              imswitch/imcommon/_test
              imswitch/imcontrol/_test/unit
              imswitch/imcontrol/controller/_test
            extra: ""
          - lane: improcess
            paths: imswitch/improcess/_test
            # TODO: drop this ignore once the SNOUTY CPU deskew all-zero-output
            # failure is fixed (pre-existing failure on main).
            extra: "--ignore=imswitch/improcess/_test/test_snouty.py"
          - lane: core
            # imcommon (API export/threading contracts, framework wrappers,
            # cancellation, shutdown) and the imscripting module.
            paths: >-
              imswitch/imcommon/_test
              imswitch/imscripting/_test
            extra: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            setup.cfg
            pyproject.toml
      - name: Install dependencies
        # Single source of truth: the `test` extra pulls install_requires +
        # pytest / pytest-qt / pytest-cov / pytest-timeout / pytest-xdist. No
        # hand-maintained dependency list to drift out of sync.
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run no-hardware test lane
        env:
          QT_QPA_PLATFORM: offscreen
          # Force the non-interactive matplotlib backend so nothing tries to
          # load an interactive Qt backend on the headless runner.
          MPLBACKEND: Agg
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        # --timeout aborts any hung test instead of stalling the runner.
        # -n auto shards the lane across all runner cores; because plugin
        # autoload is disabled above, xdist must be loaded explicitly via
        # -p xdist.plugin (same as pytestqt / pytest_timeout). The -p flags
        # propagate to the xdist workers.
        run: |
          pytest -p xdist.plugin -p pytestqt.plugin -p pytest_timeout \
            ${{ matrix.paths }} ${{ matrix.extra }} \
            -n auto \
            --timeout=180 \
            -v

  micromanager-plugin:
    # The first plugin lane in this file, and the first lane that installs
    # imswitch2 itself on Python >= 3.11 (every other job is 3.10). The plugin
    # needs 3.11: pymmcore, which pymmcore-plus builds on, does not support 3.10.
    # It runs the plugin's own tests (examples/plugins/imswitch-device-micromanager/
    # tests) against the real MMCore with the mm-test-adapters demo devices, including
    # the end-to-end test that boots ImControl headlessly on the plugin's demo setup
    # template (docs/design/plans/micromanager-bridge.md, section 5, P1).
    name: Micro-Manager plugin (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            setup.cfg
            pyproject.toml
            examples/plugins/imswitch-device-micromanager/pyproject.toml
      - name: Install ImSwitch2, then the plugin
        # ImSwitch2 first, so the plugin's `imswitch2>=0.1` requirement is met by
        # this checkout (the distribution is named imswitch2, see setup.cfg) and
        # the plugin installs WITH its dependencies -- no --no-deps: pymmcore-plus
        # comes from the plugin's own pin. The `test` extra of the plugin adds
        # mm-test-adapters (the demo adapters), pytest and jsonschema.
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
          pip install -e "examples/plugins/imswitch-device-micromanager[test]"
      - name: Check the plugin is installed and discoverable
        # Fail here, loudly, instead of letting a missing install turn the
        # plugin's tests into skips.
        run: |
          python -c "import pymmcore_plus, mm_test_adapters, imswitch_device_micromanager"
          python -m imswitch.imcontrol.model.plugins list | grep micromanager.core
      - name: Run the plugin tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        # No xdist (unlike the lanes above): the tests share one MMCore per
        # process and the end-to-end module boots one app for several tests, in
        # order. A fresh runner's HOME is empty, so nothing needs isolating; the
        # tests move the user-files folder themselves anyway.
        run: |
          pytest -p pytestqt.plugin -p pytest_timeout \
            examples/plugins/imswitch-device-micromanager/tests \
            --timeout=300 \
            -v

  build:
    name: Package Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            setup.cfg
            pyproject.toml
      - run: pip install build
      - name: Build package
        run: python -m build --no-isolation 2>/dev/null || python -m build
